<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto AI Kamus Builder (Batch Processing)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader {
            border: 3px solid #f3f3f3; border-top: 3px solid #6366f1; border-radius: 50%;
            width: 16px; height: 16px; animation: spin 1s linear infinite; display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 p-6 font-sans">

    <div class="max-w-6xl mx-auto bg-white p-6 rounded-lg shadow-lg border-t-4 border-indigo-600">
        <h1 class="text-2xl font-bold text-gray-800 mb-1">AI Kamus Builder (Batch Processing)</h1>
        <p class="text-sm text-gray-500 mb-6">Mengekstrak 30.000+ Keyword menjadi Kamus dengan memecahnya ke dalam batch menggunakan API SumoPod / OpenAI.</p>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <div class="flex flex-col gap-4 border-r pr-6">
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">API Key (SumoPod / OpenAI)</label>
                    <input type="password" id="apiKey" class="w-full p-2 border rounded focus:ring-indigo-500 text-sm" placeholder="sk-...">
                </div>

                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block text-sm font-bold text-gray-700 mb-1">Model AI</label>
                        <input type="text" id="aiModel" class="w-full p-2 border rounded text-sm" value="glm-5.1">
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm font-bold text-gray-700 mb-1">Ukuran Batch (Baris)</label>
                        <input type="number" id="batchSize" class="w-full p-2 border rounded text-sm" value="500">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Paste Raw Keywords (Bisa puluhan ribu baris)</label>
                    <textarea id="rawInput" rows="10" class="w-full p-3 border border-gray-300 rounded focus:ring-indigo-500 font-mono text-sm" placeholder="Paste data mentah di sini..."></textarea>
                </div>

                <button onclick="startProcessing()" id="startBtn" class="bg-indigo-600 text-white font-bold py-3 rounded hover:bg-indigo-700 transition flex justify-center items-center gap-2">
                    Mulai Ekstraksi AI
                </button>

                <div id="progressContainer" class="hidden">
                    <div class="flex justify-between text-sm font-bold text-gray-700 mb-1">
                        <span id="progressText">Memproses Batch 0 / 0</span>
                        <span id="progressPercent">0%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div id="progressBar" class="bg-indigo-600 h-2.5 rounded-full" style="width: 0%"></div>
                    </div>
                    <p id="statusLog" class="text-xs text-gray-500 mt-2 h-12 overflow-y-auto"></p>
                </div>
            </div>

            <div class="flex flex-col h-full pl-2">
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-sm font-bold text-gray-700">Hasil `kamus.js` (Otomatis Digabung)</label>
                    <div class="text-xs font-bold text-gray-500 flex gap-3">
                        <span>Stop: <span id="countStop" class="text-red-500">0</span></span>
                        <span>Intent: <span id="countIntent" class="text-blue-500">0</span></span>
                        <span>Entity: <span id="countEntity" class="text-green-500">0</span></span>
                    </div>
                </div>
                
                <textarea id="outputCode" class="flex-1 w-full p-3 border border-gray-300 rounded font-mono text-xs bg-gray-50" readonly placeholder="Kode akan muncul di sini setelah diproses..."></textarea>
                
                <div class="mt-4 flex gap-3">
                    <button onclick="copyKamus()" id="copyBtn" class="flex-1 bg-green-600 text-white py-2 rounded hover:bg-green-700 font-bold transition flex items-center justify-center gap-2">
                        📋 Copy Code
                    </button>
                    <button onclick="downloadKamus()" id="downloadBtn" class="flex-1 bg-blue-600 text-white py-2 rounded hover:bg-blue-700 font-bold transition flex items-center justify-center gap-2">
                        💾 Download .js
                    </button>
                </div>
            </div>
        </div>
    </div>

    <textarea id="aiSystemPrompt" style="display:none;">
Anda adalah Ahli NLP & SEO Lexicographer. Tugas Anda adalah mengekstrak kamus dari array keywords yang diberikan user.

Kategorikan ke dalam 3 jenis ini:
1. "stopWords": Kata hubung, preposisi, pronouns, dan kata tanya yang tidak punya nilai SEO (contoh: a, the, on, to, does, who, are).
2. "intentVerbs": Kata kerja spesifik yang menunjukkan niat/tindakan (contoh: buy, apply, accept, affect, take, get).
3. "entityFixes": Objek JSON untuk menyatukan merek/konsep yang terpisah atau salah eja (contoh: "ebt food stamps": "foodstamps", "sam s club": "samsclub", "baskin robbins": "baskinrobbins").

ATURAN KETAT:
- BALAS HANYA DENGAN JSON OBJECT VALID, tanpa markdown, tanpa teks pembuka/penutup!
- Format Wajib: {"stopWords": ["..."], "intentVerbs": ["..."], "entityFixes": {"...": "..."}}
    </textarea>

    <script>
        // State Global untuk menampung hasil dari semua batch
        let globalStopWords = new Set();
        let globalIntentVerbs = new Set();
        let globalEntityFixes = {};

        function logStatus(msg) {
            const logEl = document.getElementById('statusLog');
            logEl.innerHTML = `> ${msg}<br>${logEl.innerHTML}`;
        }

        async function startProcessing() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const rawText = document.getElementById('rawInput').value.trim();
            const batchSize = parseInt(document.getElementById('batchSize').value) || 500;
            const aiModel = document.getElementById('aiModel').value.trim() || 'glm-5.1';

            if (!apiKey || !rawText) return alert("API Key dan Keyword wajib diisi!");

            // 1. Bersihkan Data & Pecah menjadi Batch
            const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            if (lines.length === 0) return alert("Data kosong!");

            let batches = [];
            for (let i = 0; i < lines.length; i += batchSize) {
                batches.push(lines.slice(i, i + batchSize));
            }

            // Reset UI & State
            globalStopWords.clear();
            globalIntentVerbs.clear();
            globalEntityFixes = {};
            document.getElementById('outputCode').value = '';
            document.getElementById('statusLog').innerHTML = '';
            
            const btn = document.getElementById('startBtn');
            btn.disabled = true;
            btn.classList.replace('bg-indigo-600', 'bg-gray-400');
            document.getElementById('progressContainer').classList.remove('hidden');

            // 2. Loop melalui setiap Batch (Sequential agar tidak membebani API)
            logStatus(`Memulai ekstraksi ${lines.length} keywords dalam ${batches.length} batch...`);
            
            for (let i = 0; i < batches.length; i++) {
                let percent = Math.round(((i) / batches.length) * 100);
                document.getElementById('progressText').innerText = `Memproses Batch ${i + 1} dari ${batches.length}`;
                document.getElementById('progressPercent').innerText = `${percent}%`;
                document.getElementById('progressBar').style.width = `${percent}%`;
                
                logStatus(`Mengirim Batch ${i + 1} ke AI...`);

                try {
                    await processBatchWithAI(batches[i], apiKey, aiModel);
                    updateOutputUI();
                } catch (error) {
                    logStatus(`<span class="text-red-500">Error di Batch ${i + 1}: ${error.message}</span>`);
                    if(!confirm(`Terjadi error di Batch ${i + 1}: ${error.message}.\nLanjut ke batch berikutnya?`)) {
                        break;
                    }
                }
            }

            // Selesai
            document.getElementById('progressText').innerText = `Selesai!`;
            document.getElementById('progressPercent').innerText = `100%`;
            document.getElementById('progressBar').style.width = `100%`;
            btn.disabled = false;
            btn.classList.replace('bg-gray-400', 'bg-indigo-600');
            logStatus(`<span class="text-green-600 font-bold">Proses seluruh batch selesai!</span>`);
        }

        async function processBatchWithAI(keywordsArray, apiKey, aiModel) {
            const systemPromptText = document.getElementById('aiSystemPrompt').value.trim();

            const payload = {
                model: aiModel,
                messages: [
                    { role: "system", content: systemPromptText },
                    { role: "user", content: JSON.stringify(keywordsArray) }
                ],
                temperature: 0.1
            };

            const response = await fetch('https://ai.sumopod.com/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                body: JSON.stringify(payload)
            });

            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            
            const jsonResponse = await response.json();
            if (jsonResponse.error) throw new Error(jsonResponse.error.message);

            // Pembersihan Backtick JSON 100% Aman dari Editor
            let aiText = jsonResponse.choices[0].message.content;
            let bt = String.fromCharCode(96) + String.fromCharCode(96) + String.fromCharCode(96);
            aiText = aiText.split(bt + "json").join("");
            aiText = aiText.split(bt + "JSON").join("");
            aiText = aiText.split(bt).join("");
            aiText = aiText.trim();
            
            const result = JSON.parse(aiText);

            // GABUNGKAN HASIL (MERGE STATE)
            if (result.stopWords) {
                result.stopWords.forEach(w => globalStopWords.add(w.toLowerCase()));
            }
            if (result.intentVerbs) {
                result.intentVerbs.forEach(w => globalIntentVerbs.add(w.toLowerCase()));
            }
            if (result.entityFixes) {
                for (let [wrong, correct] of Object.entries(result.entityFixes)) {
                    globalEntityFixes[wrong.toLowerCase()] = correct.toLowerCase();
                }
            }
        }

        function updateOutputUI() {
            // Update Counter
            document.getElementById('countStop').innerText = globalStopWords.size;
            document.getElementById('countIntent').innerText = globalIntentVerbs.size;
            document.getElementById('countEntity').innerText = Object.keys(globalEntityFixes).length;

            // Buat Teks Code Kamus.js
            let output = `// Auto-Generated kamus.js via AI Batching\n\n`;
            
            output += `const stopWords = ${JSON.stringify(Array.from(globalStopWords))};\n\n`;
            output += `const intentVerbs = ${JSON.stringify(Array.from(globalIntentVerbs))};\n\n`;
            
            let entityStr = `{\n`;
            for (let [k, v] of Object.entries(globalEntityFixes)) {
                entityStr += `    "${k}": "${v}",\n`;
            }
            if (Object.keys(globalEntityFixes).length > 0) {
                entityStr = entityStr.slice(0, -2) + `\n}`;
            } else {
                entityStr = `{}`;
            }
            output += `const entityFixes = ${entityStr};\n`;

            const outputEl = document.getElementById('outputCode');
            outputEl.value = output;
            
            // Auto scroll ke bawah
            outputEl.scrollTop = outputEl.scrollHeight;
        }

        // --- FUNGSI COPY ---
        function copyKamus() {
            const text = document.getElementById('outputCode').value;
            if(!text.trim()) return alert("Kode kamus masih kosong!");
            
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.innerHTML = "✓ Tersalin!";
                btn.classList.replace('bg-green-600', 'bg-gray-600');
                setTimeout(() => {
                    btn.innerHTML = "📋 Copy Code";
                    btn.classList.replace('bg-gray-600', 'bg-green-600');
                }, 2000);
            });
        }

        // --- FUNGSI DOWNLOAD OTOMATIS ---
        function downloadKamus() {
            const text = document.getElementById('outputCode').value;
            if(!text.trim()) return alert("Tidak ada kode untuk di-download!");

            // 1. Bungkus teks ke dalam Blob (Virtual File)
            const blob = new Blob([text], { type: "text/javascript" });
            
            // 2. Buat URL sementara untuk Blob tersebut
            const url = URL.createObjectURL(blob);
            
            // 3. Buat elemen <a> bayangan (tidak terlihat di layar)
            const a = document.createElement("a");
            a.href = url;
            a.download = "kamus.js"; // Nama file yang akan terunduh
            
            // 4. Klik elemen <a> tersebut secara paksa via sistem
            document.body.appendChild(a);
            a.click();
            
            // 5. Bersihkan sampah memori
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
